<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        body {
            background-color: #f4f4f4;
            font-family: Arial, Helvetica, sans-serif;
        }
        .main {
            background-color: white;
            border: none;
            border-radius: 15px;
            margin: 15px;
            width: 400px;
        }
        .main .header {
            padding: 15px;
        }
        .main .body {
            padding: 0px 15px;
            color: #555;
        }
        b {
            color: black; 
        }
        p {
            padding-bottom: 10px;
        }
        .progress_container {
            width: 100%;
            height: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .progress_bar {
            height: 100%;
            background-color: greenyellow;
            border-top-left-radius: 5px;
            border-bottom-left-radius: 5px ;
        }
        .card {
            color: rgb(183, 117, 25);
            background-color: rgb(245, 212, 172);
            border-radius: 15px;
            text-align: center;
            width: 30%;
            padding: 5px;
            position: relative;
            bottom: 200px;
            left: 250px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="header">
            <h3>Niềng răng chỉnh nha</h3>
        </div>
        <div class="body">
            <p>Bác sĩ <i class="fa-solid fa-user-doctor"></i> <b>:BS.Nguyễn Minh Tâm</b></p>
            <p>Chi phí <i class="fa-solid fa-calculator"></i> <b>:25.000.000 đ</b></p>
            <p><b>Tiến trình điều trị</b></p>
            <div class="progress_container">
                <div class="progress_bar" style="width: 70%;"></div>
            </div>
            <p>Bắt đầu: 10/03/2025</p>
            <p>Dự kiến hoàn thành: 10/03/2026</p>
        </div>
        <div class="card">
            <h5>Đang điều chị</h5>
        </div>
    </div>
</body>
</html>
