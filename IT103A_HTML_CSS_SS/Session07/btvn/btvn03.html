<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
    }

    .card {
        width: 390px;
        height: 450px;
        border: 1px solid black;
        font-family: 'Times New Roman', Times, serif;
    }

    .card header {
        color: rgb(255, 166, 0);
        padding: 3px 10px 10px;
    }

    .card main .card_img {
        width: 100%;
        height: auto;
        display: block;
    }

    .card main h2 {
        padding: 10px;
    }
    .card main h3 {
        color: rgb(47, 255, 75);
        padding: 0px 0px 10px 10px;
    }
    .card main p {
        width: 95%;
        padding: 0px 0px 10px 10px;
        color: #00000089;
    }
</style>

<body>
    <div class="card">
        <header>
            <h2>⭐ NHA SĨ NỔI BẬT</h2>
        </header>
        
        <main>
            <img src="https://img.freepik.com/free-photo/pleased-young-female-doctor-wearing-medical-robe-stethoscope-around-neck-standing-with-closed-posture_409827-254.jpg"
                class="card_img" />
            <h2>BS. Nguyễn Minh Tâm</h2>
            <h3>Nha khoa thẩm mỹ</h3>
            <p>Hơn 10 năm kinh nghiệm trong lĩnh vực nha khoa thẩm mỹ,
                chuyên tẩy trắng răng, dán sứ và phục hình nụ cười.
            </p>
        </main>
    </div>
</body>

</html>
