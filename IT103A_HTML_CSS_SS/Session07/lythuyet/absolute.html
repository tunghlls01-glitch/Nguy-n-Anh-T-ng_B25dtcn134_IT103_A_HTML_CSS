<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            position: absolute;
            width: 300px;
            height: 200px;
            background-color: red;
            margin: 50px;
        }

        .absolute {
            width: 50px;
            height: 50px;
            background-color: blue;
            position: absolute;
            bottom:10px;
            right: 0;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="absolute">
            relative
        </div>
    </div>
</body>

</html>
