<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn{
            border: none;
            padding: 10px;
            background-color: tomato;
            color: aliceblue;
            border-radius: 10px;
            width: 80px;
            transition: width 0.5s ease-in-out ;/* duration | timing function | delay */
        }
        .btn:hover {
            cursor: pointer;
            background-color: green;
            width: 100px;
        }
    </style>
</head>
<body>
    <!-- 
        transition: chuyển đổi hiệu ứng
     -->
        <button class="btn">
            login
        </button>
</body>
</html>
