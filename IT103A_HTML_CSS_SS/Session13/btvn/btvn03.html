<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./btvn03.css">
</head>

<body>
    <main>
        <h1 style="background-color: white;">Đăng ký</h1>
        <p style="background-color: white;">Tạo tài khoản để bắt đầu học tập trên hệ thống e-learning</p>
        <!-- dòng  1 -->
        <div class="line_one">
            <div style="background-color: white;">
                <label for="id01" style="background-color: white;">Họ và tên đệm</label>
                <input type="text" placeholder="Nguyễn Văn" id="id01" style="background-color: white;">
            </div>
            <div style="background-color: white;">
                <label for="id02" style="background-color: white;">Tên đầy đủ</label>
                <input type="text" placeholder="Nguyễn Văn" id="id02" style="background-color: white;">
            </div>
        </div>
        <!-- dòng 2 -->
        <div class="line_two">
            <label for="id03" style="background-color: white;">Số điện thoại</label>
            <input type="tel" id="id03" placeholder="0912 345 678" style="background-color: white;">
        </div>

        <div class="line_two">
            <label for="id04" style="background-color: white;">Email</label>
            <input type="tel" id="id04" placeholder="Nhập địa chỉ email" style="background-color: white;">
        </div>

        <div class="line_two">
            <label for="id05" style="background-color: white;">Mật khẩu</label>
            <input type="tel" id="id03" placeholder="Nhập mật khẩu" style="background-color: white;">
        </div>

        <div class="line_two">
            <label for="id03" style="background-color: white;">Nhập lại mật khẩu</label>
            <input type="tel" id="id03" placeholder="Nhập lại mật khẩu" style="background-color: white;">
        </div>

        <button>Đăng ký</button>
        <hr>
        <div class="line_three">
            <p>Đã có tài khoản? <span>Đăng nhập</span></p>
        </div>
    </main>
</body>

</html>
