<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    flex-box: giúp căn chỉnh các phần tử, giúp dàn layout theo chiều nganh hoặc chiều dọc
    trước không có flex-box: (float, margin)

    1. hai khái niệm qtroong flex-box 
    + flex-container: phần tử cha
    +flex-item: phần tử con
    2. muốn 1 khối trở thành flex-bõ thì phải có giá trị thuộc tính display
    
     -->
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
