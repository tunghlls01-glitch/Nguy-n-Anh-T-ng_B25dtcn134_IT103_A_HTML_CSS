<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTVN7</title>
    <link rel="stylesheet" href="./btvn07.css">
</head>

<body>

    <div class="banner">
        <img src="./image/a90e60c0f63b6eb12e37b1db209a7028f01ae037.png">
        <div class="banner_content">
            <h1>Đặt Bàn Tại La Belle Époque</h1>
            <p class="banner_text">
                Trải nghiệm không gian Fine Dining sang trọng và dịch vụ hoàn hảo.
            </p>
        </div>
    </div>

    <div class="bottom">
        <div class="bottom_line">
            <div class="bottom_card">
                <img src="./image/Overlay+Shadow (1).png">
            </div>

            <div class="bottom_card">
                <img src="./image/Overlay+Shadow (2).png">
            </div>

            <div class="bottom_card">
                <img src="./image/Overlay+Shadow (3).png">
            </div>
            <div class="bottom_card">
                <img src="./image/Overlay+Shadow (4).png">
            </div>
        </div>
        <div class="bottom_line">
            <div class="bottom_card">
                <img src="./image/Overlay+Shadow (5).png">
            </div>
            <div class="bottom_card">
                <img src="./image/Overlay+Shadow (6).png">
            </div>
            <div class="bottom_card">
                <img src="./image/Overlay+Shadow (7).png">
            </div>
        </div>
    </div>

    <div class="booking">
        <h2>Đặt Bàn Ngay Hôm Nay</h2>
        <p>Chúng tôi sẽ liên hệ xác nhận trong vòng 1 giờ.</p>

        <div class="booking_line">
            <input type="text" placeholder="Họ và tên">
            <input type="tel" placeholder="Số điện thoại">
            <input type="email" placeholder="Email">
        </div>

        <div class="booking_line">
            <input type="date">
            <input type="time">
            <input type="number" placeholder="Số lượng khách">
        </div>

        <div class="booking_line">
            <button class="booking_button">
                Gửi Yêu Cầu Đặt Bàn
            </button>
        </div>
    </div>

</body>

</html>
