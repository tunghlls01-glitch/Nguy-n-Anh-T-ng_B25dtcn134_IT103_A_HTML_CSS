<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- 
    RWD: responsive web design: thiết kế web tương thích với nhiều thiết bị. 
    (máy tính để bàn, laptop, máy tính bảng, điện thoại...) 
    I. 2 kỹ thuật chính
        1. Mobile First: thiết kế trên màn hình điện thoại trước sau đó thiết kế lên các màn hình lớn hơn. 
        (xu hướng bây h là mobile)
        2. Desktop First: thiết kế trên màn hình máy tính trước sau đó thiết kế xuống các màn hình nhỏ hơn.
    II. Các điểm breakpoint: điểm giới hạn của các màn hình 
        1. < 576px: 
        2. 576 <= X < 768px : điện thoại
        3. 768px <= X < 992 : máy tính bảng
        4. 992px <= X < 1400px : laptop
        5. >= 1400px : máy tính bàn
    III. media screen (QUAN TRỌNG ==> VIẾT CODE RESPONSIVE)
    @media screen and (max-width: ) ==> đối với desktop fisrt

    @media screen anh (min-width: ) ==> đối với mobile first

    
    
    -->


</body>
</html>
